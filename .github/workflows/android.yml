# App Android (carpeta android/): compila, prueba y publica el APK.
# - Siempre: pruebas unitarias + APK de depuración (artefacto de la ejecución).
# - Si existen los secretos de firma: APK de release firmado y publicado como Release de GitHub
#   (descarga fija: https://github.com/<repo>/releases/latest/download/azyvion-crm.apk).
# Secretos: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: Android

on:
  push:
    branches: [main, app-android]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      HAY_FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pruebas unitarias
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: APK de depuración
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # Los errores de compilación quedan como anotaciones visibles en la ejecución
      - name: Resumen de errores
        if: failure()
        run: |
          L="$RUNNER_TEMP/build.log"
          # GitHub muestra hasta 10 anotaciones por paso: se agrupan varios errores por anotación
          { grep -E "^e: " "$L"; grep -A6 -E "What went wrong" "$L"; grep -E "(AssertionError|expected:|FAILED$)" "$L"; }             | grep -v "^> Task" | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/android/app/src/main/java/com/azyvion/crm/##'             | head -60 | paste -sd'|' | fold -w 900 | head -10             | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: azyvion-crm-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # APK de prueba descargable sin iniciar sesión (pre-release pública), solo si no hay firma
      - name: Publicar APK de prueba
        if: env.HAY_FIRMA != 'true' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-prueba-${{ github.run_number }}
          name: Azyvion CRM Android (prueba ${{ github.run_number }})
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK de prueba (firma de depuración). Para actualizar a una versión nueva hay que desinstalar la anterior.
            Requiere Android 8.0 o superior.

      - name: Preparar llave de firma
        if: env.HAY_FIRMA == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/azyvion.p12"

      - name: APK de release firmado
        if: env.HAY_FIRMA == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/azyvion.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/azyvion-crm.apk"

      - name: Publicar Release
        if: env.HAY_FIRMA == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: Azyvion CRM Android 1.0.${{ github.run_number }}
          make_latest: true
          files: ${{ runner.temp }}/azyvion-crm.apk
          body: |
            App Android de Azyvion CRM, versión 1.0.${{ github.run_number }}.
            Descarga directa: azyvion-crm.apk (abajo). Requiere Android 8.0 o superior.
